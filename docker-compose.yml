services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-go
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tracker:tracker@postgres:5432/tracker
      PORT: "3001"
      CORS_ORIGINS: http://localhost:4887,https://tracker.performance:4888
      COOKIE_SECURE: "false"
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      DISTRACTION_BUDGET_DEFAULT: "60"
      OBSIDIAN_EXPORT_DIR: /vault
      TZ: ${TZ:-UTC}
    ports:
      - "3001:3001"
    volumes:
      - "${OBSIDIAN_VAULT_DIR:-./data/obsidian-export}:/vault"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "4887:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
    ports:
      - "4888:443"
    depends_on:
      - frontend

volumes:
  pgdata:
