services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tracker:tracker@postgres:5432/tracker
      YOUTUBE_BUDGET_DEFAULT: "60"
      PORT: "3001"
      OBSIDIAN_EXPORT_DIR: /vault
      ICLOUD_APPLE_ID: ${ICLOUD_APPLE_ID:-}
      ICLOUD_APP_PASSWORD: ${ICLOUD_APP_PASSWORD:-}
      ICLOUD_REMINDERS_LIST_NAME: ${ICLOUD_REMINDERS_LIST_NAME:-GTD}
    ports:
      - "3001:3001"
    volumes:
      - "${OBSIDIAN_VAULT_DIR:-./data/obsidian-export}:/vault"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "4887:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
    ports:
      - "4888:443"
    depends_on:
      - frontend

volumes:
  pgdata:
